# -----------------------------------------------------------------------------
# Main Configuration for CLIP Zero-Shot Evaluation Framework
# -----------------------------------------------------------------------------

# --- 1. Global Settings ---
settings:
  # This is your main output directory for all results
  results_dir: "clip_reproduction_results"
  
  # Set your GPU device ID here (e.g., "0", "1", "2")
  cuda_device: "2"
  
  # Set to a number (e.g., 500) for a quick "smoke test"
  # Set to null to run on all images (this will take a very long time)
  limit_images: null 

# --- 2. Models to Test ---
# List of all 9 model names from the paper
models:
  - "RN50"
  - "RN101"
  - "RN50x4"
  - "RN50x16"
  - "RN50x64"
  - "ViT-B/32"
  - "ViT-B/16"
  - "ViT-L/14"
  - "ViT-L/14@336px"

# --- 3. Datasets to Evaluate ---
# Config for each dataset.
datasets:
  cifar10:
    name: "CIFAR10"
    # Root dir for torchvision to download/find the dataset
    root_path: "~/.cache" 
    # ImageNet-specific path (not used here)
    imagenet_val_path: null

  cifar100:
    name: "CIFAR100"
    root_path: "~/.cache"
    imagenet_val_path: null

  # caltech101:
  #   name: "Caltech101"
